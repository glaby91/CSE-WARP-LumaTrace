name: Build LumaTrace renderer (Windows)

on:
  push:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  pull_request:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Report scene asset hydration
        shell: pwsh
        run: |
          $asset = 'assets/vehicles/porsche_930/scene/porsche_930.glb'
          $header = Get-Content $asset -TotalCount 1
          if ($header -like 'version https://git-lfs.github.com/spec/v1') {
            Write-Warning 'Git LFS payloads are unavailable on this branch checkout. The Qt/D3D11 executable will compile, but the packaged scene is not runnable until the GLB and textures are uploaded to LFS.'
          } else {
            Write-Host 'Scene model is hydrated.'
          }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build full LumaTrace application
        run: cmake --build build --config Release --target CSE_WARP_LumaTrace --parallel 2
      - name: Compile D3D11 compute shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "$env:ProgramFiles(x86)\Windows Kits\10\bin" -Filter fxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK on this runner.' }
          $shader = 'src/render/shaders/triangle_lighting.hlsl'
          & $fxc.FullName /nologo /T cs_5_0 /E CSCollectVisible /Fo "$env:RUNNER_TEMP\CSCollectVisible.cso" $shader
          if ($LASTEXITCODE -ne 0) { throw "CSCollectVisible HLSL compilation failed: $LASTEXITCODE" }
          & $fxc.FullName /nologo /T cs_5_0 /E CSShadeVisibleTriangles /Fo "$env:RUNNER_TEMP\CSShadeVisibleTriangles.cso" $shader
          if ($LASTEXITCODE -ne 0) { throw "CSShadeVisibleTriangles HLSL compilation failed: $LASTEXITCODE" }
      - name: Deploy Qt runtime beside the executable
        run: windeployqt --release --no-translations build/Release/CSE_WARP_LumaTrace.exe
      - name: Upload Windows compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSE-WARP-LumaTrace-windows-x64-compile
          path: build/Release/
          if-no-files-found: error
