name: Build LumaTrace renderer (Windows)

on:
  push:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  pull_request:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build full LumaTrace application
        run: cmake --build build --config Release --target CSE_WARP_LumaTrace --parallel 2
      - name: Deploy Qt runtime beside the executable
        run: windeployqt --release --no-translations build/Release/CSE_WARP_LumaTrace.exe
      - name: Upload runnable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CSE-WARP-LumaTrace-windows-x64
          path: build/Release/
          if-no-files-found: error
