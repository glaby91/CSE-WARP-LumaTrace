name: Build LumaTrace renderer (Windows)

on:
  push:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  pull_request:
    branches: [DX11LightTracing]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/**'
      - 'assets/vehicles/porsche_930/scene/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Report scene asset hydration
        shell: pwsh
        run: |
          $asset = 'assets/vehicles/porsche_930/scene/porsche_930.glb'
          $header = Get-Content $asset -TotalCount 1
          if ($header -like 'version https://git-lfs.github.com/spec/v1') {
            Add-Content $env:GITHUB_ENV 'LUMATRACE_SCENE_READY=false'
            Write-Warning 'Git LFS payloads are unavailable on this branch checkout. The Qt/D3D11 executable will compile, but the packaged scene is not runnable until the GLB and textures are uploaded to LFS.'
          } else {
            Add-Content $env:GITHUB_ENV 'LUMATRACE_SCENE_READY=true'
            Write-Host 'Scene model is hydrated.'
          }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build full LumaTrace application
        run: cmake --build build --config Release --target CSE_WARP_LumaTrace --parallel 2
      - name: Compile D3D11 compute shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter fxc.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $fxc) { throw 'fxc.exe was not found in the Windows SDK on this runner.' }
          $shader = 'src/render/shaders/triangle_lighting.hlsl'
          & $fxc.FullName /nologo /T cs_5_0 /E CSCollectVisible /Fo "$env:RUNNER_TEMP\CSCollectVisible.cso" $shader
          if ($LASTEXITCODE -ne 0) { throw "CSCollectVisible HLSL compilation failed: $LASTEXITCODE" }
          & $fxc.FullName /nologo /T cs_5_0 /E CSShadeVisibleTriangles /Fo "$env:RUNNER_TEMP\CSShadeVisibleTriangles.cso" $shader
          if ($LASTEXITCODE -ne 0) { throw "CSShadeVisibleTriangles HLSL compilation failed: $LASTEXITCODE" }
      - name: Deploy Qt runtime beside the executable
        run: windeployqt --release --no-translations build/Release/CSE_WARP_LumaTrace.exe
      - name: Capture WARP renders for 1, 2 and 4 samples
        shell: pwsh
        run: |
          $env:LUMATRACE_FORCE_WARP = '1'
          $exe = (Resolve-Path 'build/Release/CSE_WARP_LumaTrace.exe').Path
          $root = Join-Path $env:RUNNER_TEMP 'LumaTrace-benchmark'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if ($env:LUMATRACE_SCENE_READY -eq 'true') {
            $scene = 'assets/vehicles/porsche_930/scene/scene.json'
            Write-Host 'Benchmark scene: Porsche 930.'
          } else {
            $sceneDir = Join-Path $env:RUNNER_TEMP 'LumaTrace-synthetic-scene'
            python tools/generate_benchmark_scene.py --out-dir $sceneDir
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate the synthetic benchmark scene.' }
            $scene = Join-Path $sceneDir 'scene.json'
            Write-Warning 'Benchmark scene: synthetic 241,260-triangle mesh; Porsche LFS objects are missing.'
          }
          $metrics = @()
          $images = @()
          $repeats = 5
          foreach ($sample in @(1, 2, 4)) {
            for ($repeat = 1; $repeat -le $repeats; $repeat++) {
              $sampleRoot = Join-Path $root "samples-$sample/repeat-$repeat"
              $process = Start-Process -FilePath $exe -ArgumentList @("--samples=$sample", "--output-dir=$sampleRoot", '--exit-after-render', $scene) -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "LumaTrace WARP capture for $sample sample(s), repeat $repeat exited with $($process.ExitCode)." }
              $image = Get-ChildItem (Join-Path $sampleRoot 'renders') -Filter "*_${sample}_*" | Select-Object -First 1
              $log = Get-ChildItem (Join-Path $sampleRoot 'logs') -Filter '*.log' | Select-Object -First 1
              if (-not $image -or -not $log) { throw "Missing PNG or log for $sample sample(s), repeat $repeat." }
              $logText = Get-Content $log.FullName -Raw
              if ($logText -match 'ÉCHEC chargement|ERREUR D3D11|ERREUR : lecture staging') { throw "LumaTrace capture log contains an error: $($log.FullName)" }
              $frameMatch = [regex]::Match($logText, 'frame · rendu complet du profil courant — (\d+) ms')
              $exportMatch = [regex]::Match($logText, 'export · capture PNG du rendu final — (\d+) ms')
              if (-not $frameMatch.Success -or -not $exportMatch.Success) { throw "Missing timing metrics in $($log.FullName)." }
              $metrics += [pscustomobject]@{ samples = $sample; repeat = $repeat; frame_ms = [int]$frameMatch.Groups[1].Value; export_ms = [int]$exportMatch.Groups[1].Value; image = $image.Name }
              if ($repeat -eq 1) { $images += [pscustomobject]@{ samples = $sample; path = $image.FullName } }
            }
          }
          $metrics | Export-Csv (Join-Path $root 'timings.csv') -NoTypeInformation
          $summary = foreach ($group in ($metrics | Group-Object samples)) {
            $frames = @($group.Group | ForEach-Object { [double]$_.frame_ms } | Sort-Object)
            $exports = @($group.Group | ForEach-Object { [double]$_.export_ms } | Sort-Object)
            $frameMedian = $frames[[int][Math]::Floor($frames.Count / 2)]
            $exportMedian = $exports[[int][Math]::Floor($exports.Count / 2)]
            $frameMean = ($frames | Measure-Object -Average).Average
            $frameVariance = (($frames | ForEach-Object { [Math]::Pow($_ - $frameMean, 2) } | Measure-Object -Sum).Sum / $frames.Count)
            [pscustomobject]@{ samples = [int]$group.Name; repeats = $frames.Count; frame_median_ms = $frameMedian; frame_min_ms = $frames[0]; frame_max_ms = $frames[-1]; frame_cv_percent = [Math]::Round(([Math]::Sqrt($frameVariance) / $frameMean) * 100, 2); export_median_ms = $exportMedian; export_min_ms = $exports[0]; export_max_ms = $exports[-1] }
          }
          $summary | Export-Csv (Join-Path $root 'timings-summary.csv') -NoTypeInformation
          $summary | Format-Table | Out-String | Write-Host
          Add-Type -AssemblyName System.Drawing
          $reference = [System.Drawing.Bitmap]::new($images[0].path)
          $drift = @()
          foreach ($candidate in $images | Select-Object -Skip 1) {
            $bitmap = [System.Drawing.Bitmap]::new($candidate.path)
            if ($bitmap.Width -ne $reference.Width -or $bitmap.Height -ne $reference.Height) { throw 'WARP captures have different dimensions.' }
            [long]$sum = 0;[long]$changed = 0
            for ($y = 0; $y -lt $reference.Height; $y++) {
              for ($x = 0; $x -lt $reference.Width; $x++) {
                $a = $reference.GetPixel($x,$y);$b = $bitmap.GetPixel($x,$y)
                $difference = [Math]::Abs([int]$a.R-[int]$b.R)+[Math]::Abs([int]$a.G-[int]$b.G)+[Math]::Abs([int]$a.B-[int]$b.B)
                $sum += $difference;if ($difference -ne 0) { $changed++ }
              }
            }
            $drift += [pscustomobject]@{ reference_samples = 1; samples = $candidate.samples; changed_pixels = $changed; mean_absolute_channel_difference = [Math]::Round($sum / ($reference.Width*$reference.Height*3), 6) }
            $bitmap.Dispose()
          }
          $reference.Dispose()
          $drift | Export-Csv (Join-Path $root 'image-drift.csv') -NoTypeInformation
          $drift | Format-Table | Out-String | Write-Host
      - name: Upload Windows compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: CSE-WARP-LumaTrace-windows-x64-compile
          path: build/Release/
          if-no-files-found: error
      - name: Upload WARP benchmark images and timings
        uses: actions/upload-artifact@v4
        with:
          name: CSE-WARP-LumaTrace-warp-benchmark
          path: ${{ runner.temp }}/LumaTrace-benchmark/
          if-no-files-found: error
